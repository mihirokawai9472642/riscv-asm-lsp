# License bundling configuration for cargo-about (aligned with deny.toml).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-3-Clause-Clear",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
private = { ignore = true }

# tree-sitter-riscv 0.3.1 omits its LICENSE file from the published crate archive;
# pull the exact LICENSE from its pinned git commit (c89b7c525d90).
[tree-sitter-riscv.clarify]
license = "MIT"

[[tree-sitter-riscv.clarify.git]]
path = "LICENSE"
checksum = "0ab35e7060ea9bae728b2285ed36a2aeddc872bef09b8461fc99de046816f49b"

# windows-link / windows-sys use lowercase `license-mit` / `license-apache-2.0`,
# which cargo-about does not auto-detect without explicit clarification.
[windows-link.clarify]
license = "MIT OR Apache-2.0"

[[windows-link.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

[[windows-link.clarify.files]]
path = "license-apache-2.0"
license = "Apache-2.0"
checksum = "c16f8dcf1a368b83be78d826ea23de4079fe1b4469a0ab9ee20563f37ff3d44b"

[windows-sys.clarify]
license = "MIT OR Apache-2.0"

[[windows-sys.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

[[windows-sys.clarify.files]]
path = "license-apache-2.0"
license = "Apache-2.0"
checksum = "c16f8dcf1a368b83be78d826ea23de4079fe1b4469a0ab9ee20563f37ff3d44b"
