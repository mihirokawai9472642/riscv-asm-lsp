[package]
name = "riscv-asm-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Language server for RISC-V assembly in GNU assembler syntax"
include = [
    "src/**",
    "data/riscv.json",
    "data/texts.json",
    "Cargo.toml",
    "LICENSE.md",
    "THIRD_PARTY_NOTICES.md",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-x86_64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-aarch64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
name = "riscv_asm_lsp"
path = "src/lib.rs"

[[bin]]
name = "riscv-asm-lsp"
path = "src/main.rs"

[[test]]
name = "integration"
path = "../tests/integration.rs"

[dependencies]
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
ignore.workspace = true
url.workspace = true
yaml_serde.workspace = true
tree-sitter.workspace = true
tree-sitter-riscv.workspace = true
