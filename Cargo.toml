[workspace]
members = ["server", "xtask"]
exclude = ["zed"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mihirokawai9472642/riscv-asm-lsp"

[workspace.dependencies]
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
ignore = "0.4"
tree-sitter = "0.27"
tree-sitter-riscv = "0.3.1"
