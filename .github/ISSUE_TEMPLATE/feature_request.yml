name: Feature request
description: Propose a new feature or a change in behaviour before implementing it
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do that riscv-asm-lsp or the Zed extension does not support.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you suggest, and any alternatives you considered.
    validations:
      required: true
