name: Design decision
description: Discuss a behaviour or architecture decision before implementing
labels: ["design"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What real-project finding or problem requires a decision?
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options
      description: Candidate approaches and their trade-offs.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Affected sections of docs/design.md, existing behaviour, or compatibility.
    validations:
      required: false
