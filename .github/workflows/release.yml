name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            ext: tar.gz
            bin: riscv-asm-lsp
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            ext: tar.gz
            bin: riscv-asm-lsp
            musl: true
          - target: x86_64-apple-darwin
            os: macos-15
            ext: tar.gz
            bin: riscv-asm-lsp
            musl: false
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
            bin: riscv-asm-lsp
            musl: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
            bin: riscv-asm-lsp.exe
            musl: false

    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      ASSET: riscv-asm-lsp-${{ matrix.target }}.${{ matrix.ext }}
      BIN_NAME: ${{ matrix.bin }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, sys, tomllib

          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              print(f"error: tag {tag!r} does not match Cargo.toml workspace.package.version {version!r} (expected {expected!r})", file=sys.stderr)
              sys.exit(1)
          print(f"Verified tag {tag} matches Cargo.toml version {version}")
          PY

      - name: Install Linux musl build tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools file

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100"
          targets: ${{ matrix.target }}

      - name: Run non-tool tests
        shell: bash
        run: cargo test --locked

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          cargo build --release --locked -p riscv-asm-lsp --target "${{ env.TARGET }}"

      - name: Verify static linking (Linux musl)
        if: matrix.musl
        run: |
          bin="target/${{ env.TARGET }}/release/${{ env.BIN_NAME }}"
          file_out="$(file "$bin")"
          echo "$file_out"
          echo "$file_out" | grep -qE "statically linked|static-pie linked"
          if echo "$file_out" | grep -q "dynamically linked"; then
            echo "error: binary is dynamically linked" >&2
            exit 1
          fi

      - name: Verify LSP lifecycle
        shell: python
        env:
          BIN: target/${{ matrix.target }}/release/${{ matrix.bin }}
        run: |
          import json, os, subprocess

          def frame(msg):
              body = json.dumps(msg).encode("utf-8")
              return f"Content-Length: {len(body)}\r\n\r\n".encode("ascii") + body

          def read_msg(stream):
              headers = {}
              while True:
                  line = stream.readline().decode("ascii")
                  if line in ("\r\n", "\n", ""):
                      break
                  key, val = line.split(":", 1)
                  headers[key.strip().lower()] = val.strip()
              return json.loads(stream.read(int(headers["content-length"])))

          proc = subprocess.Popen(
              [os.environ["BIN"]],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
          )
          proc.stdin.write(frame({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {"capabilities": {}},
          }))
          proc.stdin.flush()
          init_resp = read_msg(proc.stdout)
          assert "capabilities" in init_resp.get("result", {}), init_resp

          proc.stdin.write(frame({
              "jsonrpc": "2.0",
              "method": "initialized",
              "params": {},
          }))
          proc.stdin.write(frame({
              "jsonrpc": "2.0",
              "id": 2,
              "method": "shutdown",
              "params": None,
          }))
          proc.stdin.flush()
          shut_resp = read_msg(proc.stdout)
          assert shut_resp.get("id") == 2 and "error" not in shut_resp, shut_resp

          proc.stdin.write(frame({
              "jsonrpc": "2.0",
              "method": "exit",
              "params": None,
          }))
          proc.stdin.flush()
          rc = proc.wait(timeout=10)
          assert rc == 0, f"expected exit code 0, got {rc}"

      - name: Generate third-party license bundle
        shell: bash
        run: |
          cargo install --locked --version 0.9.3 --features cli cargo-about
          mkdir -p dist/pkg
          cargo about generate --locked -c about.toml -m server/Cargo.toml about.hbs -o dist/pkg/THIRD_PARTY_LICENSES.md
          grep -q "Copyright (c) 2025 Oskar Meyenburg" dist/pkg/THIRD_PARTY_LICENSES.md
          if grep -qE '<year>|<copyright holders>' dist/pkg/THIRD_PARTY_LICENSES.md; then
            echo "error: placeholder text left in THIRD_PARTY_LICENSES.md" >&2
            exit 1
          fi
          if grep -q 'riscv-asm-lsp ' dist/pkg/THIRD_PARTY_LICENSES.md; then
            echo "error: project crate should not appear in THIRD_PARTY_LICENSES.md" >&2
            exit 1
          fi

          if [ "${{ matrix.musl }}" = "true" ]; then
            test -f /usr/share/doc/musl/copyright
            musl_ver="$(dpkg-query -W -f='${Version}' musl)"
            {
              echo "## musl libc (${musl_ver})"
              echo
              echo 'Static binaries for `'"${{ env.TARGET }}"'` statically link musl libc:'
              echo
              echo '````text'
              cat /usr/share/doc/musl/copyright
              echo '````'
            } >> dist/pkg/THIRD_PARTY_LICENSES.md
          fi

          rust_copyright="$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html"
          test -f "$rust_copyright"
          cp "$rust_copyright" dist/pkg/COPYRIGHT-library.html

      - name: Package release archive and SHA-256 checksum
        shell: python
        run: |
          import hashlib, os, pathlib, shutil, tarfile, zipfile

          pkg = pathlib.Path("dist/pkg")
          target = os.environ["TARGET"]
          bin_name = os.environ["BIN_NAME"]
          asset = os.environ["ASSET"]

          src_bin = pathlib.Path("target") / target / "release" / bin_name
          dst_bin = pkg / bin_name
          shutil.copy2(src_bin, dst_bin)
          if not bin_name.endswith(".exe"):
              os.chmod(dst_bin, 0o755)
          shutil.copy2("LICENSE.md", pkg / "LICENSE.md")
          shutil.copy2("THIRD_PARTY_NOTICES.md", pkg / "THIRD_PARTY_NOTICES.md")

          archive_path = pathlib.Path("dist") / asset
          if asset.endswith(".zip"):
              with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  for item in sorted(pkg.iterdir()):
                      zf.write(item, arcname=item.name)
          else:
              with tarfile.open(archive_path, "w:gz") as tf:
                  for item in sorted(pkg.iterdir()):
                      ti = tf.gettarinfo(item, arcname=item.name)
                      ti.uid = 0
                      ti.gid = 0
                      ti.uname = ""
                      ti.gname = ""
                      with open(item, "rb") as fh:
                          tf.addfile(ti, fh)

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          sha_path = pathlib.Path("dist") / f"{asset}.sha256"
          sha_path.write_text(f"{digest}  {asset}\n", encoding="utf-8")
          print(f"Packaged {asset} ({digest})")

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ env.ASSET }}*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
