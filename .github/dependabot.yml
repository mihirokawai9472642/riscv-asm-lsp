version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # `tree-sitter-riscv` must stay pinned to the same commit as `zed/extension.toml`.
    ignore:
      - dependency-name: "tree-sitter-riscv"
  - package-ecosystem: "cargo"
    directory: "/zed"
    schedule:
      interval: "weekly"
    # `zed_extension_api` updates must be checked against the supported Zed version.
    ignore:
      - dependency-name: "zed_extension_api"
