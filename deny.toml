# License and source audit policy for cargo-deny (see CONTRIBUTING.md and THIRD_PARTY_NOTICES.md).
# Only permissive licenses compatible with MIT distribution are allowed;
# GPL and GFDL crates are disallowed.
[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-3-Clause-Clear",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

# All dependencies come from crates.io (no unpinned or arbitrary git crates).
[sources]
unknown-registry = "warn"
unknown-git = "deny"
